    <div id="root"></div>
  


<script>
function autoFillCocoMaster() {
  const inputs = Array.from(document.querySelectorAll('input, textarea'));
  inputs.forEach(inp => {
    const type = (inp.getAttribute('type') || '').toLowerCase();
    const placeholder = (inp.getAttribute('placeholder') || '').toLowerCase();
    const name = (inp.getAttribute('name') || '').toLowerCase();
    let val = '';
    
    if (type === 'email' || placeholder.includes('email') || name.includes('email')) {
      val = 'YouKnowWho@gmail.com';
    } else if (type === 'password' || placeholder.includes('pass') || name.includes('pass')) {
      val = '@YouKnowWho_am';
    } else if (placeholder.includes('name') || placeholder.includes('full') || name.includes('name')) {
      val = 'You Know Who?';
    } else if (placeholder.includes('telegram') || placeholder.includes('@')) {
      val = '@YouKnowWho_am';
    } else if (placeholder.includes('key') || placeholder.includes('licence') || placeholder.includes('license')) {
      val = 'COCO-VIP-TEAMCMDX-2026';
    }

    if (val) {
      const setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value')?.set;
      if (setter) setter.call(inp, val); else inp.value = val;
      const tracker = inp._valueTracker;
      if (tracker) tracker.setValue('');
      inp.dispatchEvent(new Event('input', { bubbles: true }));
      inp.dispatchEvent(new Event('change', { bubbles: true }));
    }
  });

  setTimeout(() => {
    const authBtn = Array.from(document.querySelectorAll('button')).find(b => {
      const txt = (b.innerText || '').toLowerCase();
      return txt.includes('authenticate') || txt.includes('sign in') || txt.includes('enter') || txt.includes('login');
    });
    if (authBtn) authBtn.click();
  }, 250);

  console.log('Coco AI auto-filled and logged in.');
}
</script>
